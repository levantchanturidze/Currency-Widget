name: GELRates
options:
  bundleIdPrefix: com.levan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: P3C867TH36
    CODE_SIGN_STYLE: Automatic

targets:
  GELRatesApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GELRatesApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levan.GELRatesApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: GELRatesWidget
        embed: true
    info:
      path: GELRatesApp/Info.plist
      properties:
        CFBundleDisplayName: GEL Rates
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  GELRatesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GELRatesWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.levan.GELRatesApp.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: GELRatesWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
